services:
  postgres:
    image: postgres:17-alpine
    container_name: pokedex-postgres
    restart: unless-stopped
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER:?Defina DATABASE_USER no arquivo .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD no arquivo .env}
      POSTGRES_DB: ${DATABASE_NAME:?Defina DATABASE_NAME no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: